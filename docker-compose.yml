services:
  bridge:
    build: .
    image: telegram-max-bridge
    container_name: telegram-max-bridge
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 512m

    environment:
      - TZ=Europe/Moscow
      # Diagnostic: dump VIDEO_PLAY payload for a recent MAX video at startup.
      - VIDEO_PROBE=${VIDEO_PROBE:-0}
      # Device type declared in the MAX login handshake (DESKTOP/ANDROID/IOS).
      - MAX_DEVICE_TYPE=${MAX_DEVICE_TYPE:-DESKTOP}
      # Client version claimed to MAX; MAX refuses new auth from stale clients.
      - MAX_APP_VERSION=${MAX_APP_VERSION:-}
      - MAX_BUILD_NUMBER=${MAX_BUILD_NUMBER:-}

    security_opt:
      - no-new-privileges:true

    volumes:
      - ./config:/app/config
      - ./sessions:/app/sessions

    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; f='/app/sessions/.healthcheck'; sys.exit(0 if os.path.exists(f) and (time.time()-float(open(f).read().strip()))<600 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
